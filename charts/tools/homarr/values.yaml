# Default values for homarr
# Modern homelab dashboard

# Override names
nameOverride: ""
fullnameOverride: ""

# Image configuration
image:
  repository: ghcr.io/homarr-labs/homarr
  tag: "latest@sha256:7d87f7fdd35f8bbee1b922b9b74fad8ce9967a1a66b8c6db1a168780c03d693b"
  pullPolicy: IfNotPresent

# Timezone
timezone: "UTC"

# Homarr-specific configuration
homarr:
  port: 7575

# Service configuration
service:
  type: ClusterIP
  port: 7575

# Config persistence
persistence:
  appdata:
    enabled: true
    existingClaim: ""
    mountPath: /appdata

# Resource limits
resources: {}

# Deployment strategy
strategy:
  type: Recreate

# Probes
livenessProbe:
  enabled: true
  initialDelaySeconds: 30
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 5
  httpGet:
    path: /
    port: http

readinessProbe:
  enabled: true
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 10
  failureThreshold: 3
  httpGet:
    path: /
    port: http

# Secret for encryption key
# Must be 64 character hex string (generate with: openssl rand -hex 32)
secretEncryptionKey:
  existingSecret: ""
  secretKey: "SECRET_ENCRYPTION_KEY"

# HTTPRoute configuration (Gateway API) - the successor to ingress for the
# Envoy Gateway tiers. ingress: and route: are independent; both may be
# enabled during a migration window.
route:
  enabled: false
  # Gateway(s) to attach to, e.g.:
  #   - name: gateway-private
  #     namespace: gateway-private
  #     sectionName: https
  parentRefs: []
  hostnames: []
  # Optional full override of spec.rules; default is a single "/" PathPrefix
  # rule to the chart service
  rules: []
  # Optional HTTPRoute annotations (e.g. dns/managed: "false")
  annotations: {}
  # Optional rule timeouts, e.g. request: 3600s (long-lived connections)
  timeouts: {}
