# Common labels/annotations applied to all resources
commonLabels: {}
commonAnnotations: {}

# Override the name of the chart
nameOverride: ""

# Override the full name of the resources
# This is useful for creating simpler service names
# Example: fullnameOverride: "db" creates a service named "db" instead of "release-mongodb"
fullnameOverride: ""

# MongoDB architecture (currently only standalone is supported)
architecture: standalone

# Authentication configuration
auth:
  # Name of existing secret containing the root password
  # The secret must contain the key specified in existingSecretKey (default: MONGO_INITDB_ROOT_PASSWORD)
  existingSecret: ""
  existingSecretKey: MONGO_INITDB_ROOT_PASSWORD
  # Non-sensitive settings
  rootUsername: root
  database: ""

# MongoDB container image configuration
image:
  registry: docker.io
  repository: mongo
  tag: "9.0.4@sha256:dc28ed5a9d0fc616903c3f463bb1e53b92b49f441721b91926e87d90bf957ce8"
  pullPolicy: IfNotPresent

# Image pull secrets for private registries
imagePullSecrets: []

# Primary MongoDB instance configuration
primary:
  # Resource requests and limits
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1
      memory: 1Gi

  # Persistent storage configuration
  persistence:
    enabled: true
    # Storage class name (leave empty for default)
    storageClass: ""
    # Size of persistent volume
    size: 8Gi
    # Access modes
    accessModes:
      - ReadWriteOnce

  # Update strategy
  updateStrategy:
    type: RollingUpdate

  # Extra mongod arguments
  extraArgs:
    - --bind_ip_all

  # Liveness probe configuration
  livenessProbe:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
    successThreshold: 1

  # Readiness probe configuration
  readinessProbe:
    enabled: true
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
    successThreshold: 1

  # Startup probe configuration (for slow-starting instances)
  startupProbe:
    enabled: true
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30
    successThreshold: 1

  # Additional environment variables
  extraEnv: []
    # - name: TZ
    #   value: UTC

  # Pod security context
  podSecurityContext:
    fsGroup: 999

  # Container security context
  securityContext:
    runAsUser: 999
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

# Service configuration (client service)
service:
  type: ClusterIP
  port: 27017
  nodePort: null
  annotations: {}
  externalTrafficPolicy: ""
  loadBalancerIP: ""

# Headless service configuration (for StatefulSet)
headlessService:
  annotations: {}
  publishNotReadyAddresses: true

# Metrics exporter configuration (Prometheus mongodb_exporter)
metrics:
  enabled: true
  image:
    registry: docker.io
    repository: percona/mongodb_exporter
    tag: "0.54.0@sha256:934e9db87e85e0fa63654e73c3504845993a254e898783ca905e65a68848b5a4"
    pullPolicy: IfNotPresent

  # Metrics exporter resources
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

  # ServiceMonitor configuration for Prometheus Operator
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    labels: {}

# Nightly logical dumps to a volume of their own, for a file backup (such as
# restic) to copy instead of the live data folder. Every database but local
# and config is dumped with mongodump --archive, uncompressed (no --gzip) so
# the file backup compresses and deduplicates it, as auth.rootUsername. admin
# holds the users and roles. Layout of the volume:
#   <database>/<timestamp>.archive  one per database (mongorestore --archive)
#   done                            the run's timestamp, written only when
#                                   every dump succeeded
backup:
  enabled: false
  schedule: "0 3 * * *"
  timeZone: Etc/UTC
  # A run missed while the cluster was down still starts when it is back,
  # within this many seconds (20 h)
  startingDeadlineSeconds: 72000
  activeDeadlineSeconds: 7200
  # Retries after a failed run; each one dumps every database again
  backoffLimit: 2
  # Dumps kept per database. Count-based, so a pause never erodes them. The
  # file backup keeps the history; these only cover the nights it missed
  keep: 3
  persistence:
    # Empty: primary.persistence.storageClass
    storageClass: ""
    size: 10Gi
    accessModes:
      - ReadWriteOnce
  resources: {}

# Node selector for pod assignment
nodeSelector: {}

# Tolerations for pod assignment
tolerations: []

# Affinity for pod assignment
affinity: {}
