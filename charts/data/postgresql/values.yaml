# Common labels/annotations applied to all resources
commonLabels: {}
commonAnnotations: {}

# Override the name of the chart
nameOverride: ""

# Override the full name of the resources
# This is useful for creating simpler service names
# Example: fullnameOverride: "db" creates a service named "db" instead of "release-postgresql"
fullnameOverride: ""

# PostgreSQL architecture (currently only standalone is supported)
architecture: standalone

# Authentication configuration
auth:
  # Name of existing secret containing the database password
  # The secret must contain the key specified in existingSecretKey (default: POSTGRES_PASSWORD)
  existingSecret: ""
  existingSecretKey: POSTGRES_PASSWORD
  # Initdb arguments (e.g., auth method hardening)
  initdbArgs: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
  # Non-sensitive settings
  username: postgres
  database: postgres

# PostgreSQL container image configuration
image:
  registry: docker.io
  repository: postgres
  tag: "18.6@sha256:979bccfde35445db618c65107d27d08c6c21339d8dc3ad4c830c6633947be0e4"
  pullPolicy: IfNotPresent

# Image pull secrets for private registries
imagePullSecrets: []

# Primary PostgreSQL instance configuration
primary:
  # Resource requests and limits
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1
      memory: 1Gi

  # Persistent storage configuration
  persistence:
    enabled: true
    # Storage class name (leave empty for default)
    storageClass: ""
    # Size of persistent volume
    size: 8Gi
    # Access modes
    accessModes:
      - ReadWriteOnce

  # Update strategy
  updateStrategy:
    type: RollingUpdate

  # Custom PostgreSQL configuration (postgresql.conf)
  configuration: ""
  # Custom pg_hba.conf rules
  hbaConfiguration: ""

  # Liveness probe configuration
  livenessProbe:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
    successThreshold: 1

  # Readiness probe configuration
  readinessProbe:
    enabled: true
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
    successThreshold: 1

  # Startup probe configuration (for slow-starting instances)
  startupProbe:
    enabled: true
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30
    successThreshold: 1

  # Additional environment variables
  extraEnv: []
    # - name: TZ
    #   value: UTC

  # Pod security context
  podSecurityContext:
    fsGroup: 999

  # Container security context
  securityContext:
    runAsUser: 999
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

# Service configuration (client service)
service:
  type: ClusterIP
  port: 5432
  nodePort: null
  annotations: {}
  externalTrafficPolicy: ""
  loadBalancerIP: ""

# Headless service configuration (for StatefulSet)
headlessService:
  annotations: {}
  publishNotReadyAddresses: true

# Metrics exporter configuration (Prometheus postgres_exporter)
metrics:
  enabled: true
  image:
    registry: docker.io
    repository: prometheuscommunity/postgres-exporter
    tag: "v0.20.1@sha256:ac5ec343104fae0e2d84a27bb8d69b38430a11910c5382cad85d478d2bab713e"
    pullPolicy: IfNotPresent

  # Metrics exporter resources
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

  # ServiceMonitor configuration for Prometheus Operator
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    labels: {}

# Database provisioning
# Creates users and databases on every ArgoCD sync (idempotent)
# Passwords are read from secrets in the postgresql namespace
# `user` becomes the database OWNER. Owners bypass row-level security, so apps that rely on RLS
# should connect with `extraRoles`: LOGIN roles that own nothing and are forced to
# NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS, with CONNECT on the database.
# The owner (e.g. a migration job) grants them table privileges. Role names are cluster-wide.
# Example:
#   databases:
#     - name: myapp
#       user: myapp
#       passwordSecret: postgresql-credentials
#       passwordSecretKey: MYAPP_PASSWORD
#       extraRoles:                       # optional
#         - name: myapp_web
#           passwordSecret: postgresql-credentials
#           passwordSecretKey: MYAPP_WEB_PASSWORD
databases: []

# Nightly logical dumps to a volume of their own, for a file backup (such as
# restic) to copy instead of the live data folder. Every database the server
# accepts connections to is dumped with pg_dump -Fc -Z0, uncompressed so the
# file backup compresses and deduplicates it, plus the roles with
# pg_dumpall --globals-only, as auth.username (a superuser, so row-level
# security never hides rows). Layout of the volume:
#   globals/<timestamp>.sql      roles and tablespaces
#   <database>/<timestamp>.dump  one per database (pg_restore)
#   done                         the run's timestamp, written only when every
#                                dump succeeded
backup:
  enabled: false
  schedule: "0 3 * * *"
  timeZone: Etc/UTC
  # A run missed while the cluster was down still starts when it is back,
  # within this many seconds (20 h)
  startingDeadlineSeconds: 72000
  activeDeadlineSeconds: 7200
  # Retries after a failed run; each one dumps every database again
  backoffLimit: 2
  # Dumps kept per database. Count-based, so a pause never erodes them. The
  # file backup keeps the history; these only cover the nights it missed
  keep: 3
  # How long pg_dump waits for a table lock (a migration in progress) before
  # that database's dump fails
  lockWaitTimeout: 10min
  persistence:
    # Empty: primary.persistence.storageClass
    storageClass: ""
    size: 5Gi
    accessModes:
      - ReadWriteOnce
  resources: {}

# Node selector for pod assignment
nodeSelector: {}

# Tolerations for pod assignment
tolerations: []

# Affinity for pod assignment
affinity: {}
