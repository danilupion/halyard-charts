{{- if .Values.route.enabled -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  {{- include "common.metadata" (dict "name" (include "common.fullname" .) "root" $) | nindent 2 }}
  {{- with .Values.route.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml (.Values.route.parentRefs | required "route.parentRefs is required when the route is enabled") | nindent 4 }}
  {{- with .Values.route.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- if .Values.route.rules }}
    {{- toYaml .Values.route.rules | nindent 4 }}
    {{- else }}
    {{- if and .Values.ui.enabled .Values.ui.exposeAdminPath (not .Values.ui.route.enabled) }}
    # Headplane UI mounted under /admin of the main host (more specific prefix
    # wins over "/" per Gateway API route-matching rules)
    - matches:
        - path:
            type: PathPrefix
            value: /admin
      backendRefs:
        - name: {{ include "common.fullname" . }}-ui
          port: 3000
    {{- end }}
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "common.fullname" . }}
          port: {{ .Values.service.ports.http }}
      {{- with .Values.route.timeouts }}
      timeouts:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- end }}
{{- end }}
