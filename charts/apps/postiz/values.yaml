# Common labels/annotations applied to all resources
commonLabels: {}
commonAnnotations: {}

# Override the name of the chart
nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

# ---------------------------------------------------------------------------
# Postiz application
# ---------------------------------------------------------------------------
postiz:
  image:
    registry: ghcr.io
    repository: gitroomhq/postiz-app
    tag: v2.25.0@sha256:7eb4a553507ce3f200deff2ec0211ab3cf834ba19eb44dd68e83ccc236509feb
    pullPolicy: IfNotPresent

  replicaCount: 1

  service:
    type: ClusterIP
    port: 5000
    annotations: {}

  # HTTPRoute configuration (Gateway API)
  route:
    enabled: false
    parentRefs: []
    hostnames: []
    rules: []
    annotations: {}
    timeouts: {}

  persistence:
    config:
      enabled: true
      storageClassName: ""
      accessModes:
        - ReadWriteOnce
      size: 1Gi
      existingClaim: ""
    uploads:
      enabled: true
      storageClassName: ""
      accessModes:
        - ReadWriteOnce
      size: 10Gi
      existingClaim: ""

  # URLs (required). MAIN_URL/FRONTEND_URL/NEXT_PUBLIC_BACKEND_URL are derived
  # from `urls.main` if `urls.frontend`/`urls.backend` are not set.
  urls:
    main: ""
    frontend: ""
    backend: ""
    internalBackend: "http://localhost:3000"

  # Database connection. Provide a secret containing DATABASE_URL.
  database:
    existingSecret: ""
    existingSecretKey: DATABASE_URL

  # Redis URL. Either set `redis.url` directly, or provide existingSecret/Key.
  redis:
    url: ""
    existingSecret: ""
    existingSecretKey: REDIS_URL

  # JWT secret. Provide via existingSecret.
  jwt:
    existingSecret: ""
    existingSecretKey: JWT_SECRET

  # Storage provider (`local` or `cloudflare`). For `local`, uploads PVC is used.
  storage:
    provider: local
    uploadDirectory: /uploads
    publicUploadDirectory: /uploads

  # Toggles
  isGeneral: "true"
  disableRegistration: "false"

  # Extra environment variables (e.g. social media API keys)
  extraEnv: []

  # Extra envFrom (e.g. a secret with all social provider credentials)
  extraEnvFrom: []
  # - secretRef:
  #     name: postiz-social-providers

  resources: {}

  podSecurityContext: {}
  securityContext: {}

  # Startup + liveness watch the orchestrator (Temporal worker), not the UI.
  # Its /health/status (port 3002) only listens once the workers finished
  # booting and returns 500 when Temporal is unreachable (10s internal
  # timeout). Without this, an orchestrator that boots while Temporal is still
  # recovering (node reboot, upgrade, Temporal restart) hangs forever while
  # pm2 reports it online, and scheduled posts silently never publish.
  # Startup: up to 5 min to boot, then the pod is restarted.
  startupProbe:
    httpGet:
      path: /health/status
      port: orchestrator
    periodSeconds: 10
    timeoutSeconds: 12
    failureThreshold: 30

  # Liveness: ~2 min without a reachable Temporal restarts the pod so the
  # workers reconnect fresh. The UI is covered by readinessProbe only.
  livenessProbe:
    httpGet:
      path: /health/status
      port: orchestrator
    periodSeconds: 30
    timeoutSeconds: 12
    failureThreshold: 4

  readinessProbe:
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 20
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6

  nodeSelector: {}
  tolerations: []
  affinity: {}

# ---------------------------------------------------------------------------
# Worker watchdog: CronJob that restarts Postiz when no orchestrator worker
# polls the Temporal task queue (worker silently gone while the pod looks
# healthy). Needs temporal.enabled. The Temporal CLI check runs in an init
# container from temporal.server.image; RBAC is read pods + patch the Postiz
# Deployment only.
# ---------------------------------------------------------------------------
workerWatchdog:
  enabled: true
  schedule: "*/5 * * * *"
  # Postiz's main workflow queue; every orchestrator registers a poller on it.
  taskQueue: main
  # Leave younger pods to the startupProbe (5 min) instead of restarting them.
  minPodAgeSeconds: 600
  image:
    repository: bitnami/kubectl
    tag: latest@sha256:b29d8c1665b70817259ceecaea16ab27aab6368b48daf485d19436c809067492
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi

# ---------------------------------------------------------------------------
# Temporal stack (server + dedicated postgres + elasticsearch + optional UI)
# ---------------------------------------------------------------------------
temporal:
  enabled: true

  # Temporal server (auto-setup image runs schema migrations on first start)
  server:
    image:
      registry: docker.io
      repository: temporalio/auto-setup
      tag: "1.29.6.1@sha256:1263120feed69d82e4ca23b8ca6f1d702c3029fe70714e382966d0192318eab6"
      pullPolicy: IfNotPresent

    service:
      type: ClusterIP
      port: 7233

    namespace: default

    # Keep the Service endpoint-less until the frontend reports SERVING, so
    # Postiz does not connect to a Temporal that is still recovering.
    readinessProbe:
      exec:
        command:
          - sh
          - -c
          - temporal operator cluster health --address "$(hostname -i):7233"
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3

    resources: {}

    nodeSelector: {}
    tolerations: []
    affinity: {}

  # Temporal-only PostgreSQL backing store
  postgresql:
    image:
      registry: docker.io
      repository: postgres
      tag: "18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2"
      pullPolicy: IfNotPresent

    # Credentials are pulled from an existing secret (POSTGRES_USER / POSTGRES_PASSWORD keys).
    existingSecret: ""

    persistence:
      enabled: true
      storageClassName: ""
      accessModes:
        - ReadWriteOnce
      size: 10Gi

    resources: {}

  # Temporal visibility store (Elasticsearch 7.x).
  # Pinned to 7.x because Temporal 1.29.x only ships index_template_v7.json;
  # 8.x and 9.x are NOT supported by upstream Temporal.
  # See renovate.json5 for the version constraint.
  elasticsearch:
    image:
      registry: docker.io
      repository: elasticsearch
      tag: "7.17.28@sha256:a06b03a2db8db2be43d3c3851e7bcebdd4fff79f4db08c7da6bad7a8776d3e15"
      pullPolicy: IfNotPresent

    javaOpts: "-Xms256m -Xmx256m"

    # ES runs as uid 1000; fsGroup forces the kubelet to chown the PVC at mount.
    # OnRootMismatch skips the recursive chown on restarts when already correct.
    podSecurityContext:
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch

    persistence:
      enabled: true
      storageClassName: ""
      accessModes:
        - ReadWriteOnce
      size: 5Gi

    resources: {}

  # Temporal Web UI (optional)
  ui:
    enabled: false
    image:
      registry: docker.io
      repository: temporalio/ui
      tag: "2.54.1@sha256:ff0943fe532b8e33c46cd28b29e81e0ce0b6f55b9ee50a38ef1b437cc4de3fa5"
      pullPolicy: IfNotPresent

    service:
      type: ClusterIP
      port: 8080

    # HTTPRoute configuration (Gateway API) for the Temporal UI
    route:
      enabled: false
      parentRefs: []
      hostnames: []
      rules: []
      annotations: {}
      timeouts: {}

    resources: {}
