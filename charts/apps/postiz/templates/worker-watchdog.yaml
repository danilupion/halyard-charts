{{- if and .Values.temporal.enabled .Values.workerWatchdog.enabled -}}
{{- $name := printf "%s-worker-watchdog" (include "common.fullname" .) -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  {{- include "common.metadata" (dict "name" $name "root" $) | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  {{- include "common.metadata" (dict "name" $name "root" $) | nindent 2 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames:
      - {{ include "common.fullname" . }}
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  {{- include "common.metadata" (dict "name" $name "root" $) | nindent 2 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
---
# Restarts Postiz when no orchestrator worker polls the Temporal task queue.
# Catches every "worker silently gone" cause the pod probes cannot see: the
# probes only check that the Temporal server answers a fresh connection, not
# that the orchestrator's own long-lived pollers are still attached (e.g.
# after a short Temporal/Elasticsearch restart or upgrade).
apiVersion: batch/v1
kind: CronJob
metadata:
  {{- include "common.metadata" (dict "name" $name "root" $) | nindent 2 }}
spec:
  schedule: {{ .Values.workerWatchdog.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 120
      template:
        metadata:
          labels:
            {{- include "common.selectorLabels" (dict "root" $ "component" "worker-watchdog") | nindent 12 }}
        spec:
          serviceAccountName: {{ $name }}
          restartPolicy: Never
          volumes:
            - name: result
              emptyDir: {}
          # Step 1 (Temporal image, has the CLI): count pollers on the queue.
          # Writes "error" when Temporal itself is unreachable - that case is
          # the liveness probe's job, not ours.
          initContainers:
            - name: check-pollers
              {{- include "common.image" (dict "repository" (printf "%s/%s" .Values.temporal.server.image.registry .Values.temporal.server.image.repository) "tag" .Values.temporal.server.image.tag "pullPolicy" .Values.temporal.server.image.pullPolicy "root" $) | nindent 14 }}
              env:
                - name: TEMPORAL_ADDRESS
                  value: {{ printf "%s:%d" (include "postiz.temporal.server.fullname" .) (int .Values.temporal.server.service.port) | quote }}
                - name: TEMPORAL_NAMESPACE
                  value: {{ .Values.temporal.server.namespace | quote }}
                - name: TASK_QUEUE
                  value: {{ .Values.workerWatchdog.taskQueue | quote }}
              command:
                - sh
                - -c
                - |
                  if OUT=$(temporal task-queue describe --task-queue "$TASK_QUEUE" \
                        --namespace "$TEMPORAL_NAMESPACE" --address "$TEMPORAL_ADDRESS" -o json); then
                    echo "$OUT" | grep -o '"identity"' | wc -l | tr -d ' ' > /result/pollers
                  else
                    echo error > /result/pollers
                  fi
                  echo "pollers on $TASK_QUEUE: $(cat /result/pollers)"
              volumeMounts:
                - name: result
                  mountPath: /result
              {{- with .Values.workerWatchdog.resources }}
              resources:
                {{- toYaml . | nindent 16 }}
              {{- end }}
          # Step 2 (kubectl image): restart Postiz if nothing polls and the pod
          # is old enough that its startupProbe is not still handling a boot.
          containers:
            - name: restart-if-idle
              {{- include "common.image" (dict "repository" .Values.workerWatchdog.image.repository "tag" .Values.workerWatchdog.image.tag "pullPolicy" .Values.workerWatchdog.image.pullPolicy "root" $) | nindent 14 }}
              env:
                - name: NAMESPACE
                  value: {{ .Release.Namespace | quote }}
                - name: DEPLOYMENT_NAME
                  value: {{ include "common.fullname" . | quote }}
                - name: POD_SELECTOR
                  value: {{ printf "app.kubernetes.io/instance=%s,app.kubernetes.io/component=postiz" .Release.Name | quote }}
                - name: MIN_POD_AGE_SECONDS
                  value: {{ .Values.workerWatchdog.minPodAgeSeconds | quote }}
              command:
                - /bin/bash
                - -c
                - |
                  set -euo pipefail
                  POLLERS=$(cat /result/pollers)
                  if [ "$POLLERS" = "error" ]; then
                    echo "Temporal unreachable, skipping (liveness probe handles this)"
                    exit 0
                  fi
                  if [ "$POLLERS" -gt 0 ]; then
                    echo "$POLLERS poller(s) attached - OK"
                    exit 0
                  fi

                  START=$(kubectl get pods -n "$NAMESPACE" -l "$POD_SELECTOR" \
                    --field-selector=status.phase=Running \
                    -o jsonpath='{.items[0].status.startTime}' 2>/dev/null || true)
                  if [ -z "$START" ]; then
                    echo "No running Postiz pod, skipping"
                    exit 0
                  fi
                  AGE=$(( $(date +%s) - $(date -d "$START" +%s) ))
                  if [ "$AGE" -lt "$MIN_POD_AGE_SECONDS" ]; then
                    echo "No pollers, but Postiz pod is only ${AGE}s old - skipping"
                    exit 0
                  fi

                  echo "No pollers and Postiz pod is ${AGE}s old - restarting $DEPLOYMENT_NAME"
                  kubectl rollout restart deployment/"$DEPLOYMENT_NAME" -n "$NAMESPACE"
              volumeMounts:
                - name: result
                  mountPath: /result
              {{- with .Values.workerWatchdog.resources }}
              resources:
                {{- toYaml . | nindent 16 }}
              {{- end }}
{{- end }}
