{{- if and .Values.redirect.enabled .Values.listeners.http.enabled -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  {{- include "common.metadata" (dict "name" (printf "%s-redirect" (include "common.fullname" .)) "root" $) | nindent 2 }}
spec:
  parentRefs:
    - name: {{ include "common.fullname" . }}
      sectionName: http
  rules:
    # Tier-wide HTTP->HTTPS redirect (replaces per-app force-ssl-redirect)
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
{{- end }}
