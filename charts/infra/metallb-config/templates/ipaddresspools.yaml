{{- $root := . -}}
{{- range $pool := .Values.pools | default list }}
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: {{ $pool.name | required "pool.name is required" | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "common.labels" $root | nindent 4 }}
  {{- with $root.Values.commonLabels }}
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $root.Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  addresses:
    {{- range $pool.addresses }}
    - {{ . | quote }}
    {{- end }}
  {{- /* hasKey, not `with`: these are booleans and `with` swallows false */}}
  {{- if hasKey $pool "autoAssign" }}
  autoAssign: {{ $pool.autoAssign }}
  {{- end }}
  {{- if hasKey $pool "avoidBuggyIPs" }}
  avoidBuggyIPs: {{ $pool.avoidBuggyIPs }}
  {{- end }}
  {{- with $pool.serviceAllocation }}
  serviceAllocation:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
{{- end }}
