# Default values for tautulli
# Plex Media Server monitoring and statistics

# Override names
nameOverride: ""
fullnameOverride: ""

# Image configuration
image:
  repository: lscr.io/linuxserver/tautulli
  tag: "2.17.2@sha256:9ec965ca644601727504d96332e267f29b85d8778351bba87c14e3733801ed1d"
  pullPolicy: IfNotPresent

# LinuxServer container settings
linuxserver:
  puid: 1000
  pgid: 1000
  tz: "UTC"

# Tautulli-specific configuration
tautulli:
  port: 8181

# Service configuration
service:
  type: ClusterIP
  port: 8181

# Config persistence
persistence:
  config:
    enabled: true
    existingClaim: ""
    mountPath: /config

# Resource limits
resources: {}

# Deployment strategy - Recreate for single-replica stateful apps
strategy:
  type: Recreate

# Probes
livenessProbe:
  enabled: true
  initialDelaySeconds: 30
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 5
  tcpSocket:
    port: http

readinessProbe:
  enabled: true
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 10
  failureThreshold: 3
  tcpSocket:
    port: http

# HTTPRoute configuration (Gateway API) - the successor to ingress for the
# Envoy Gateway tiers. ingress: and route: are independent; both may be
# enabled during a migration window.
route:
  enabled: false
  # Gateway(s) to attach to, e.g.:
  #   - name: gateway-private
  #     namespace: gateway-private
  #     sectionName: https
  parentRefs: []
  hostnames: []
  # Optional full override of spec.rules; default is a single "/" PathPrefix
  # rule to the chart service
  rules: []
  # Optional HTTPRoute annotations (e.g. dns/managed: "false")
  annotations: {}
  # Optional rule timeouts, e.g. request: 3600s (long-lived connections)
  timeouts: {}
