# Default values for plex
# Plex Media Server - stream your media anywhere

# Override names
nameOverride: ""
fullnameOverride: ""

# Image configuration
image:
  repository: lscr.io/linuxserver/plex
  tag: "1.43.3@sha256:7f9a1d574958fc2f177c14ca190d4b811a58c274477f5bae8fb44ee676fb96bf"
  pullPolicy: IfNotPresent

# LinuxServer container settings
linuxserver:
  puid: 1000
  pgid: 1000
  tz: "UTC"

# Plex-specific configuration
plex:
  port: 32400
  # Plex claim token for initial server setup
  # Get from https://plex.tv/claim (expires in 4 minutes)
  # Only needed for initial setup, can be empty after server is claimed
  claim: ""
  # Version: docker, latest, or specific version
  version: "docker"

# Service configuration
service:
  type: ClusterIP
  port: 32400

# Config persistence
persistence:
  config:
    enabled: true
    existingClaim: ""
    mountPath: /config

# Media library mounts - flexible list of volumes
# Each entry can use either hostPath or existingClaim
#
# Example:
#   libraries:
#     - name: movies
#       mountPath: /movies
#       existingClaim: disk1-storage
#       subPath: movies/collection
#     - name: tv
#       mountPath: /tv
#       hostPath: /storage/disk2/tv
libraries: []

# Resource limits
resources: {}

# Deployment strategy - Recreate recommended for media servers
strategy:
  type: Recreate

# Probes - disabled by default as Plex can be slow to start
livenessProbe:
  enabled: false
  initialDelaySeconds: 120
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 5
  tcpSocket:
    port: http

readinessProbe:
  enabled: false
  initialDelaySeconds: 60
  periodSeconds: 10
  timeoutSeconds: 10
  failureThreshold: 3
  tcpSocket:
    port: http

# HTTPRoute configuration (Gateway API) - the successor to ingress for the
# Envoy Gateway tiers. ingress: and route: are independent; both may be
# enabled during a migration window.
route:
  enabled: false
  # Gateway(s) to attach to, e.g.:
  #   - name: gateway-private
  #     namespace: gateway-private
  #     sectionName: https
  parentRefs: []
  hostnames: []
  # Optional full override of spec.rules; default is a single "/" PathPrefix
  # rule to the chart service
  rules: []
  # Optional HTTPRoute annotations (e.g. dns/managed: "false")
  annotations: {}
  # Optional rule timeouts, e.g. request: 3600s (long-lived connections)
  timeouts: {}
