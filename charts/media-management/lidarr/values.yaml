# Default values for lidarr
# Music collection manager for Usenet and BitTorrent users

# Override names
nameOverride: ""
fullnameOverride: ""

# Image configuration
image:
  repository: lscr.io/linuxserver/lidarr
  tag: "3.1.0@sha256:2e4cdc7c8d5fa36915f446a29976ee01d3f9cc9722b8530a09121c76fbabef55"
  pullPolicy: IfNotPresent

# LinuxServer container settings
linuxserver:
  puid: 1000
  pgid: 1000
  tz: "UTC"

# Lidarr-specific configuration
lidarr:
  port: 8686

# Service configuration
service:
  type: ClusterIP
  port: 8686

# Ingress configuration
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []

# Config persistence
persistence:
  config:
    enabled: true
    existingClaim: ""
    mountPath: /config

# Storage mounts - flexible list of volumes
# For hardlinks to work, downloads and music must be on the same mount point
#
# Example:
#   storage:
#     - name: data
#       mountPath: /storage
#       existingClaim: disk1-storage
#       subPath: music
storage: []

# Resource limits
resources: {}

# Deployment strategy - Recreate for single-replica stateful apps
strategy:
  type: Recreate

# Probes
livenessProbe:
  enabled: true
  initialDelaySeconds: 30
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 5
  tcpSocket:
    port: http

readinessProbe:
  enabled: true
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 10
  failureThreshold: 3
  tcpSocket:
    port: http

# HTTPRoute configuration (Gateway API) - the successor to ingress for the
# Envoy Gateway tiers. ingress: and route: are independent; both may be
# enabled during a migration window.
route:
  enabled: false
  # Gateway(s) to attach to, e.g.:
  #   - name: gateway-private
  #     namespace: gateway-private
  #     sectionName: https
  parentRefs: []
  hostnames: []
  # Optional full override of spec.rules; default is a single "/" PathPrefix
  # rule to the chart service
  rules: []
  # Optional HTTPRoute annotations (e.g. dns/managed: "false")
  annotations: {}
  # Optional rule timeouts, e.g. request: 3600s (long-lived connections)
  timeouts: {}
