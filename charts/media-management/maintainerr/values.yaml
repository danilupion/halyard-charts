# Default values for maintainerr
# Automated media cleanup for Plex ecosystem

# Override names
nameOverride: ""
fullnameOverride: ""

# Image configuration
image:
  repository: ghcr.io/maintainerr/maintainerr
  tag: "3.25.0@sha256:f96e37e04a5e2da56edc39d96774102599de7d7617e2cc00a49a1581b01be136"
  pullPolicy: IfNotPresent

# Security context - maintainerr uses runAsUser instead of PUID/PGID
securityContext:
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

# Timezone
timezone: "UTC"

# Maintainerr-specific configuration
maintainerr:
  port: 6246

# Service configuration
service:
  type: ClusterIP
  port: 6246

# Data persistence
persistence:
  data:
    enabled: true
    existingClaim: ""
    mountPath: /opt/data

# Resource limits
resources: {}

# Deployment strategy - Recreate for single-replica stateful apps
strategy:
  type: Recreate

# Probes
livenessProbe:
  enabled: true
  initialDelaySeconds: 30
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 5
  httpGet:
    path: /api/health
    port: http

readinessProbe:
  enabled: true
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 10
  failureThreshold: 3
  httpGet:
    path: /api/health
    port: http

# HTTPRoute configuration (Gateway API) - the successor to ingress for the
# Envoy Gateway tiers. ingress: and route: are independent; both may be
# enabled during a migration window.
route:
  enabled: false
  # Gateway(s) to attach to, e.g.:
  #   - name: gateway-private
  #     namespace: gateway-private
  #     sectionName: https
  parentRefs: []
  hostnames: []
  # Optional full override of spec.rules; default is a single "/" PathPrefix
  # rule to the chart service
  rules: []
  # Optional HTTPRoute annotations (e.g. dns/managed: "false")
  annotations: {}
  # Optional rule timeouts, e.g. request: 3600s (long-lived connections)
  timeouts: {}
