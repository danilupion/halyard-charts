name: Helm chart CI
on:
  pull_request:
    paths:
      - 'charts/**'
      - 'scripts/check-charts.sh'
      - '.github/workflows/chart-ci.yml'
  push:
    branches: [ main ]
    paths:
      - 'charts/**'
      - 'scripts/check-charts.sh'
      - '.github/workflows/chart-ci.yml'
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5

      # The same script runs locally before a push.
      - name: Lint and render every chart
        run: scripts/check-charts.sh
